<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div>
        <h1>Add new project</h1>
        <form id="upload-form">
      <input type="file" id="file-input" required />
      <input type="text" id="title" placeholder="Project Name" required />
      <input type="text" id="description" placeholder="Description" />
      <input type="url" id="repoLink" placeholder="GitHub Link" required />
      <input type="url" id="liveLink" placeholder="Live Site Link" required />
      <button type="submit">Upload</button>
        </form>
        <div id="message"></div>

    </div>
  <script>
    const form = document.getElementById("upload-form");
    const messageDiv = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("file-input");
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      const github = document.getElementById("repoLink").value;
      const vercel = document.getElementById("liveLink").value;

      if (!fileInput.files[0]) {
        messageDiv.textContent = "Please select an image file.";
        return;
      }

      const formData = new FormData();
      formData.append("image", fileInput.files[0]);
      formData.append("title", title);
      formData.append("description", description);
      formData.append("liveLink", github);
      formData.append("repoLink", vercel);

      try {
        const response = await fetch("https://portfolio-cms-74ce.onrender.com/upload?", {
          method: "POST",
          body: formData,
        });

        const result = await response.json();

        if (response.ok) {
          messageDiv.textContent = "✅ Project uploaded successfully!";
          form.reset();
        } else {
          messageDiv.textContent = "❌ Error: " + (result.error || "Upload failed.");
        }
      } catch (err) {
        console.error(err);
        messageDiv.textContent = "❌ Network error. Check your backend.";
      }
    });
  </script>
</body>
</html>
